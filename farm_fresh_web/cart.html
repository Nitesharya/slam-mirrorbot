<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Fresh - Shopping Cart</title>
    <link rel="stylesheet" href="static/css/main.css">
    <style>
        /* Additional styles specific to cart page if needed */
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }
        .cart-item img {
            width: 80px;
            height: auto;
            margin-right: 15px;
        }
        .cart-item-details {
            flex-grow: 1;
        }
        .cart-total {
            margin-top: 20px;
            text-align: right;
        }
        .checkout-btn {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Farm Fresh</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="shopping-cart">
            <h2>Your Shopping Cart</h2>
            <div id="cart-items">
                <!-- Placeholder for cart items -->
                <div class="cart-item">
                    <img src="static/images/placeholder.png" alt="Product Image">
                    <div class="cart-item-details">
                        <h3>Product A</h3>
                        <p>Price: $10.00</p>
                        <p>Quantity: 1</p>
                    </div>
                    <p>$10.00</p>
                </div>
                <div class="cart-item">
                    <img src="static/images/placeholder.png" alt="Product Image">
                    <div class="cart-item-details">
                        <h3>Product B</h3>
                        <p>Price: $12.50</p>
                        <p>Quantity: 2</p>
                    </div>
                    <p>$25.00</p>
                </div>
                <p style="text-align:center; margin-top: 20px;">Your cart will update here as you add items.</p>
            </div>

            <div class="cart-total">
                <h3>Total: $35.00</h3>
                <a href="#" class="checkout-btn">Proceed to Checkout</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Farm Fresh. All rights reserved.</p>
    </footer>
    <script src="static/js/main.js"></script>
</body>
</html>
